name: CI

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Test
        run: swift test
      - name: Package development app
        run: VERSION=0.0.0 BUILD_NUMBER=${{ github.run_number }} ./scripts/package-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Speak11-development
          path: dist/Speak11.zip
